name: Release Artifacts

on:
  push:
    branches:
      - release

jobs:
  build-linux-windows:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install cross
        run: cargo install cross

      - name: Build Linux target
        run: cross build --release --target x86_64-unknown-linux-gnu

      - name: Build Windows target
        run: cross build --release --target x86_64-pc-windows-gnu

      - name: Get version
        id: get_version
        run: |
          version=$(cargo pkgid | cut -d '@' -f2)
          echo "::set-output name=VERSION::$version"

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: runlike-linux-amd64
          path: target/x86_64-unknown-linux-gnu/release/runlike

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: runlike-windows-amd64
          path: target/x86_64-pc-windows-gnu/release/runlike.exe

  build-macos:
    runs-on: macos-latest
    needs: build-linux-windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build macOS target
        run: cargo build --release

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: runlike-macos-amd64
          path: target/release/runlike

  release:
    runs-on: ubuntu-latest
    needs: [build-linux-windows, build-macos]
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: runlike-linux-amd64
          path: artifacts/linux

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: runlike-windows-amd64
          path: artifacts/windows

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: runlike-macos-amd64
          path: artifacts/macos

      - name: Get version from build-linux-windows job
        run: echo "VERSION=${{ needs.build-linux-windows.outputs.version }}" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: "v${{ env.VERSION }}"
          draft: false
          prerelease: false

      - name: Upload Linux binary to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/linux/runlike
          asset_name: runlike-linux-amd64
          asset_content_type: application/octet-stream

      - name: Upload Windows binary to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/windows/runlike.exe
          asset_name: runlike-windows-amd64.exe
          asset_content_type: application/octet-stream

      - name: Upload macOS binary to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/macos/runlike
          asset_name: runlike-macos-amd64
          asset_content_type: application/octet-str
